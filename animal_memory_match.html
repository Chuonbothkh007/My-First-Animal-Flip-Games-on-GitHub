<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Memory Match!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .game-title {
            text-shadow: 2px 4px 0px rgba(0,0,0,0.1);
        }

        .memory-game {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 16px;
            max-width: 600px;
            width: 100%;
            perspective: 1000px; /* Gives the 3D space for flipping */
        }

        @media (max-width: 450px) {
            .memory-game {
                gap: 8px;
                padding: 10px;
            }
        }

        .memory-card {
            aspect-ratio: 3/4;
            position: relative;
            cursor: pointer;
            border-radius: 16px;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        /* Hover bounce effect */
        .memory-card:not(.flip):hover {
            transform: scale(1.05);
        }

        .memory-card.flip {
            transform: rotateY(180deg);
        }

        .front-face, .back-face {
            width: 100%;
            height: 100%;
            padding: 10px;
            position: absolute;
            border-radius: 16px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border: 4px solid white;
        }

        /* The hidden side of the card (shows before flipping) */
        .front-face {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: white;
            font-size: 3rem;
            transform: rotateY(0deg);
        }

        /* Pattern for the card back */
        .front-face::after {
            content: '🐾';
            font-size: 3rem;
            opacity: 0.8;
            filter: drop-shadow(2px 4px 0px rgba(0,0,0,0.1));
        }

        /* The revealed side of the card (shows word/emoji) */
        .back-face {
            background-color: white;
            transform: rotateY(180deg);
            text-align: center;
        }

        .emoji {
            font-size: 2.5rem;
            margin-bottom: 4px;
        }
        
        @media (min-width: 600px) {
            .emoji { font-size: 3.5rem; }
        }

        .animal-word {
            font-size: 1.25rem;
            font-weight: 700;
            color: #4a5568;
            line-height: 1.2;
        }

        @media (min-width: 600px) {
            .animal-word { font-size: 1.75rem; }
        }

        /* Match animation */
        @keyframes pulse-match {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
            100% { transform: rotateY(180deg) scale(1); }
        }
        .memory-card.matched {
            animation: pulse-match 0.5s ease-in-out;
            cursor: default;
        }
        .memory-card.matched .back-face {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        /* Confetti animation */
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <div class="w-full max-w-2xl mx-auto flex flex-col items-center">
        
        <header class="text-center mb-4 w-full px-4">
            <h1 class="game-title text-4xl md:text-5xl font-bold text-pink-500 mb-2 mt-6">
                🦁 Animal Match 🐷
            </h1>
            <div class="flex justify-between items-center bg-white/70 backdrop-blur-sm px-6 py-3 rounded-full shadow-md max-w-md mx-auto">
                <div class="text-xl font-semibold text-gray-700">
                    Moves: <span id="moves-count" class="text-indigo-600 font-bold">0</span>
                </div>
                <button id="restart-btn-top" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-full shadow-lg transition-transform transform hover:scale-105 active:scale-95">
                    Restart
                </button>
            </div>
        </header>

        <main class="memory-game" id="game-board">
            <!-- Cards will be generated here by JS -->
        </main>
    </div>

    <!-- Win Modal (Hidden by default) -->
    <div id="win-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 text-center shadow-2xl transform scale-95 transition-transform duration-300" id="win-modal-content">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-4xl font-bold text-green-500 mb-2">You Win!</h2>
            <p class="text-xl text-gray-600 font-medium mb-6">
                You found all the animals in <br>
                <span id="final-moves" class="text-2xl font-bold text-indigo-600">0</span> moves!
            </p>
            <button id="play-again-btn" class="bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white text-xl font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 active:scale-95 w-full">
                Play Again 🐾
            </button>
        </div>
    </div>

    <script>
        const animals = [
            { name: 'Cat', emoji: '🐱', color: '#ffadad' },
            { name: 'Dog', emoji: '🐶', color: '#ffd6a5' },
            { name: 'Elephant', emoji: '🐘', color: '#caffbf' },
            { name: 'Lion', emoji: '🦁', color: '#fdffb6' },
            { name: 'Monkey', emoji: '🐵', color: '#9bf6ff' },
            { name: 'Pig', emoji: '🐷', color: '#a0c4ff' },
            { name: 'Cow', emoji: '🐮', color: '#bdb2ff' },
            { name: 'Bear', emoji: '🐻', color: '#ffc6ff' }
        ];

        let cardsArray = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let moves = 0;
        let matchedPairs = 0;

        const board = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves-count');
        const winModal = document.getElementById('win-modal');
        const winModalContent = document.getElementById('win-modal-content');
        const finalMovesDisplay = document.getElementById('final-moves');

        // Use Web Speech API to speak words
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech so it feels responsive
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 1.2; // slightly higher pitch for kid-friendly voice
                utterance.rate = 1.0;
                utterance.volume = 1;
                
                // Optional: try to find a female/friendly English voice
                const voices = window.speechSynthesis.getVoices();
                const friendlyVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Female') || v.name.includes('Google')));
                if (friendlyVoice) utterance.voice = friendlyVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        // Ensure voices are loaded (Chrome sometimes needs this)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        function initGame() {
            // Reset state
            board.innerHTML = '';
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            moves = 0;
            matchedPairs = 0;
            movesDisplay.innerText = moves;
            hideWinModal();

            // Duplicate array to create pairs
            cardsArray = [...animals, ...animals];

            // Shuffle array (Fisher-Yates)
            for (let i = cardsArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardsArray[i], cardsArray[j]] = [cardsArray[j], cardsArray[i]];
            }

            // Generate DOM elements
            cardsArray.forEach((animal) => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.name = animal.name;

                card.innerHTML = `
                    <div class="front-face"></div>
                    <div class="back-face" style="border-color: ${animal.color};">
                        <div class="emoji">${animal.emoji}</div>
                        <div class="animal-word" style="color: #334155">${animal.name}</div>
                    </div>
                `;

                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');
            
            // Speak the animal name
            speak(this.dataset.name);

            if (!hasFlippedCard) {
                // First click
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Second click
            secondCard = this;
            incrementMoves();
            checkForMatch();
        }

        function incrementMoves() {
            moves++;
            movesDisplay.innerText = moves;
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.name === secondCard.dataset.name;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            // It's a match
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');

            matchedPairs++;

            if (matchedPairs === animals.length) {
                setTimeout(showWinModal, 600); // Wait for final flip animation
            }

            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1200); // Give kids a bit over 1 second to see the cards
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function showWinModal() {
            speak("Yay! You win!");
            finalMovesDisplay.innerText = moves;
            winModal.classList.remove('hidden');
            // Slight delay to allow display block to apply before opacity transition
            requestAnimationFrame(() => {
                winModal.classList.remove('opacity-0');
                winModalContent.classList.remove('scale-95');
                winModalContent.classList.add('scale-100');
            });
        }

        function hideWinModal() {
            winModal.classList.add('opacity-0');
            winModalContent.classList.remove('scale-100');
            winModalContent.classList.add('scale-95');
            setTimeout(() => {
                winModal.classList.add('hidden');
            }, 300);
        }

        // Event Listeners for buttons
        document.getElementById('restart-btn-top').addEventListener('click', initGame);
        document.getElementById('play-again-btn').addEventListener('click', initGame);

        // Start the game on load
        window.addEventListener('DOMContentLoaded', initGame);

    </script>
</body>
</html>
